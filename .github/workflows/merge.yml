name: Merge

on:
  push:
    branches: [main]

jobs:
  image-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ivanbant/devops-project:$GITHUB_SHA \
            -t ivanbant/devops-project:latest. 

      - name: Run container
        run: |
          docker run -d \
            --name flask-books \
            -p 5000:5000 \
            ivanbant/devops-project:$GITHUB_SHA

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000/healthz; then
              echo "Health check passed!"
              exit 0
            fi

            echo "Waiting for Flask application..."
            sleep 3
          done

          echo "Health check failed!"
          docker logs flask-books
          exit 1

      - name: Push image to Docker Hub
        run: |
          docker push ivanbant/devops-project:$GITHUB_SHA
          docker push ivanbant/devops-project:latest
          
      - name: Stop and remove container
        if: always()
        run: docker rm -f flask-books || true

  deploy:
    needs: image-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy - Task 6 deploys the image here"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "smoke-test - Task 6 calls the deployed app here"